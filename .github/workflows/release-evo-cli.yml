name: Release self-contained evo-cli bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FASTTREE_SOURCE_SHA256: 9026ae550307374be92913d3098f8d44187d30bea07902b9dcbfb123eaa2050f

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: unix
            target: bun-linux-x64-baseline
            label: Linux x86-64
            bundle: evo-cli-linux-x64
            executable: evo-cli
            fasttree: FastTree
            archive: evo-cli-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            platform: unix
            target: bun-linux-arm64
            label: Linux ARM64
            bundle: evo-cli-linux-arm64
            executable: evo-cli
            fasttree: FastTree
            archive: evo-cli-linux-arm64.tar.gz
          - os: macos-15-intel
            platform: unix
            target: bun-darwin-x64
            label: macOS Intel
            bundle: evo-cli-macos-x64
            executable: evo-cli
            fasttree: FastTree
            archive: evo-cli-macos-x64.tar.gz
          - os: macos-14
            platform: unix
            target: bun-darwin-arm64
            label: macOS Apple silicon
            bundle: evo-cli-macos-arm64
            executable: evo-cli
            fasttree: FastTree
            archive: evo-cli-macos-arm64.tar.gz
          - os: ubuntu-latest
            platform: windows
            target: bun-windows-x64-baseline
            label: Windows x86-64
            bundle: evo-cli-windows-x64
            executable: evo-cli.exe
            fasttree: FastTree.exe
            archive: evo-cli-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: morgannprice/fasttree
          ref: 29c5e62fbcd93230ee325f9c6a17b81f00e3c72a
          path: third_party/fasttree
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Windows cross-compiler
        if: matrix.platform == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:models
      - run: npm run typecheck --workspace @phylo-workbench/evo-cli
      - run: npm run test --workspace @phylo-workbench/evo-cli
      - name: Verify pinned FastTree source
        shell: bash
        run: |
          actual=$(node -e "const f=require('fs'),c=require('crypto');process.stdout.write(c.createHash('sha256').update(f.readFileSync('third_party/fasttree/old/FastTree-2.1.11.c')).digest('hex'))")
          test "$actual" = "$FASTTREE_SOURCE_SHA256"
      - name: Compile evo-cli
        run: |
          node -e "require('node:fs').mkdirSync('release/${{ matrix.bundle }}', { recursive: true })"
          bun build apps/evo-cli/src/standalone.ts --compile --target=${{ matrix.target }} --outfile="release/${{ matrix.bundle }}/${{ matrix.executable }}"
      - name: Compile separate FastTree executable (Unix)
        if: matrix.platform == 'unix'
        shell: bash
        run: cc -DUSE_DOUBLE -O3 -finline-functions -funroll-loops -Wall -o "release/${{ matrix.bundle }}/${{ matrix.fasttree }}" third_party/fasttree/old/FastTree-2.1.11.c -lm
      - name: Compile separate FastTree executable (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: x86_64-w64-mingw32-gcc -DUSE_DOUBLE -O3 -finline-functions -funroll-loops -Wall -o "release/${{ matrix.bundle }}/${{ matrix.fasttree }}" third_party/fasttree/old/FastTree-2.1.11.c -lm
      - name: Add notices and corresponding source
        shell: bash
        run: |
          cp apps/evo-cli/README.md "release/${{ matrix.bundle }}/README.md"
          cp apps/evo-cli/FASTTREE_BUILD.md "release/${{ matrix.bundle }}/FASTTREE_BUILD.md"
          cp THIRD_PARTY_NOTICES.md "release/${{ matrix.bundle }}/THIRD_PARTY_NOTICES.md"
          cp LICENSE "release/${{ matrix.bundle }}/EvoOnline-LICENSE"
          cp third_party/fasttree/LICENSE "release/${{ matrix.bundle }}/FastTree-LICENSE"
          cp third_party/fasttree/old/FastTree-2.1.11.c "release/${{ matrix.bundle }}/FastTree-2.1.11.c"
      - name: Smoke-test actual release executables (Unix)
        if: matrix.platform == 'unix'
        shell: bash
        run: |
          "release/${{ matrix.bundle }}/${{ matrix.executable }}" version
          printf '>A\nACGTACGTACGT\n>B\nACGTACGTACGA\n>C\nACGTTCGTACGA\n' | "release/${{ matrix.bundle }}/${{ matrix.fasttree }}" -nt > release/fasttree-smoke.nwk
          test -s release/fasttree-smoke.nwk
          "release/${{ matrix.bundle }}/${{ matrix.executable }}" run --config apps/evo-cli/tests/fixtures/fasttree-fubar.pipeline.json --input apps/evo-cli/tests/fixtures/smoke.fasta --output release/evo-cli-smoke-output --quiet
          test -s release/evo-cli-smoke-output/run-manifest.json
          node -e "const m=require('./release/evo-cli-smoke-output/run-manifest.json');if(m.summary.failedRoutes!==0||m.summary.completedRoutes!==2)process.exit(1)"
      - name: Check Windows executable formats
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          file "release/${{ matrix.bundle }}/${{ matrix.executable }}" | grep -q 'PE32+'
          file "release/${{ matrix.bundle }}/${{ matrix.fasttree }}" | grep -q 'PE32+'
      - name: Create release archive (Unix)
        if: matrix.platform == 'unix'
        shell: bash
        working-directory: release
        run: tar -czf "${{ matrix.archive }}" "${{ matrix.bundle }}"
      - name: Create release archive (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        working-directory: release
        run: zip -r "${{ matrix.archive }}" "${{ matrix.bundle }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  windows-smoke:
    name: Windows x86-64 runtime smoke test
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: evo-cli-windows-x64.zip
          path: release
      - name: Extract Windows bundle
        shell: pwsh
        run: |
          Expand-Archive -Path release/evo-cli-windows-x64.zip -DestinationPath release
      - name: Verify packaged evo-cli starts on Windows
        shell: pwsh
        run: |
          & "release/evo-cli-windows-x64/evo-cli.exe" version
          if ($LASTEXITCODE -ne 0) { throw "evo-cli version failed" }
      - name: Verify packaged FastTree runs on Windows
        shell: pwsh
        run: |
          ">A`nACGTACGTACGT`n>B`nACGTACGTACGA`n>C`nACGTTCGTACGA" |
            & "release/evo-cli-windows-x64/FastTree.exe" -nt |
            Set-Content release/fasttree-smoke.nwk
          if ($LASTEXITCODE -ne 0 -or !(Test-Path release/fasttree-smoke.nwk)) { throw "FastTree smoke test failed" }
      - name: Run packaged evo-cli pipeline on Windows
        shell: pwsh
        run: |
          & "release/evo-cli-windows-x64/evo-cli.exe" run `
            --config apps/evo-cli/tests/fixtures/fasttree-fubar.pipeline.json `
            --input apps/evo-cli/tests/fixtures/smoke.fasta `
            --output release/evo-cli-smoke-output
          if ($LASTEXITCODE -ne 0) {
            $detail = if (Test-Path release/evo-cli-smoke-output/run-log.csv) {
              (Get-Content release/evo-cli-smoke-output/run-log.csv | Select-Object -Last 8) -join " | "
            } else {
              "The CLI failed before writing run-log.csv."
            }
            Write-Output "::error title=Windows evo-cli pipeline failed::$detail"
            exit 1
          }
      - name: Check Windows pipeline manifest
        shell: pwsh
        run: |
          $manifest = Get-Content release/evo-cli-smoke-output/run-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.summary.failedRoutes -ne 0 -or $manifest.summary.completedRoutes -ne 2) {
            throw "Unexpected evo-cli smoke-test route summary"
          }

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release bundles
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
